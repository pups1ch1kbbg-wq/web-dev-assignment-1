<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4: CSS Table and Form</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="task4-body">

  <nav class="navbar">
    <a href="index.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html" class="active">Task 4</a>
  </nav>

  <div class="task4-container">
    
    <section class="section-block">
      <h2 id="table-heading">Student Grade Report</h2>
      <table class="styled-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Pedro Pascal</td>
            <td>Web Development</td>
            <td>A</td>
          </tr>
          <tr class="highlight-row">
            <td>Zhangir Kairov</td>
            <td>Data Structures</td>
            <td>A+</td>
          </tr>
          <tr>
            <td>Joel Miller</td>
            <td>UI/UX Design</td>
            <td>A-</td>
          </tr>
          <tr>
            <td>John Rod</td>
            <td>Database Systems</td>
            <td>B+</td>
          </tr>
          <tr>
            <td colspan="2">Average Class Grade</td>
            <td>A-</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="section-block">
      <form id="feedback-form-container" action="#" method="post" class="feedback-form">
        <h2>Feedback Form</h2>
        
        <div class="form-group">
          <label for="fullname">Name:</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label for="role">Role:</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select your role...</option>
            <option value="Student">Student</option>
            <option value="Teacher">Teacher</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Would you recommend this course?</label>
          <div class="radio-group">
            <label><input type="radio" name="recommend" value="Yes" checked> Yes</label>
            <label><input type="radio" name="recommend" value="No"> No</label>
          </div>
        </div>

        <div class="form-group">
          <label for="comments">Comments:</label>
          <textarea id="comments" name="comments" rows="4" placeholder="Write your comments here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </section>

  </div>

</body>
</html>
